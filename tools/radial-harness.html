<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radial harness</title>
<link rel="stylesheet" href="../styles/etu.css">
<style>
  body { margin: 0; background: #131b23; width: 100vw; height: 100vh; overflow: hidden; }
  .fake-token { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: #1f2a36; border: 3px solid #5aa6c9; }
</style>
</head>
<body>
<div class="fake-token" id="tok"></div>
<!-- A stand-in for the Cypher Card Sheet's cards (its real CSS isn't available offline). -->
<div id="cards" style="position:absolute; left:20px; bottom:20px; display:flex; gap:10px;"></div>
<style>
  .ccs-card { position: relative; width: 148px; height: 114px; overflow: hidden; border-radius: 6px; border-top: 3px solid #c7d0da; background: #151b25; }
  .ccs-card-body { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; font: 600 12px sans-serif; text-align: center; padding-bottom: 8px; }
  .ccs-card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ccs-card-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,11,16,.94), rgba(8,11,16,.08) 72%); }
  .ccs-card-name { position: relative; }
</style>
<script type="module">
// Minimal browser-side Foundry mock for rendering the real radial menu (tools/radial-preview.mjs).
const MOD = 'fhl-etu-conditions';
const lang = (await (await fetch('../lang/en.json')).json())[MOD];
const lookup = (key) => key.replace(`${MOD}.`, '').split('.').reduce((o, k) => o?.[k], lang) ?? key;
const warnings = [];
window.warnings = warnings;
window.game = {
   user: { isGM: true },
   i18n: {
      localize: lookup,
      format: (key, data) => String(lookup(key)).replace(/\{(\w+)\}/g, (_, k) => data[k])
   },
   settings: { get: () => true },
   keyboard: { isModifierActive: () => false }
};
window.CONFIG = { statusEffects: [], Token: { objectClass: class {} } };
window.CONST = { ACTIVE_EFFECT_SHOW_ICON: { NEVER: 0 } };
window.ui = { notifications: { warn: (m) => warnings.push(m) } };
window.foundry = { canvas: { containers: {} } };
window.fromUuidSync = () => null;

let nextId = 1;
class Effect
{
   constructor(actor, data) { Object.assign(this, { id: `e${nextId++}`, disabled: false }, structuredClone(data)); this.statuses = new Set(data.statuses); this.parent = actor; }
   getFlag(s, k) { return this.flags?.[s]?.[k]; }
   async update(d) { for (const [k, v] of Object.entries(d)) { const p = k.split('.'); let o = this; for (const x of p.slice(0, -1)) { o = o[x] ??= {}; } o[p.at(-1)] = v; } }
   async delete() { this.parent.effects = this.parent.effects.filter((e) => e !== this); }
}
class Item
{
   constructor(parent, name, type, flags = {}, id = `i${nextId++}`, system = {}) { Object.assign(this, { id, parent, name, type, flags, system }); }
   getFlag(s, k) { return this.flags[s]?.[k]; }
   async setFlag(s, k, v) { (this.flags[s] ??= {})[k] = v; }
   async unsetFlag(s, k) { delete this.flags[s]?.[k]; }
}
const actor = {
   name: 'Corvus', uuid: 'Actor.corvus', type: 'pc', documentName: 'Actor', isOwner: true, effects: [],
   async createEmbeddedDocuments(_t, list) { const m = list.map((d) => new Effect(actor, d)); actor.effects.push(...m); return m; },
   async deleteEmbeddedDocuments(_t, ids) { actor.effects = actor.effects.filter((e) => !ids.includes(e.id)); }
};
// A realistic unit: Cypher tags, a Card Sheet linked pair (artifact + attack), and gear that is not a system.
actor.items = [
   new Item(actor, 'Hard Point', 'tag', {}, 'tagHP'),
   Object.assign(new Item(actor, 'Rail Cannon', 'attack', { cyphersystem: { tags: ['tagHP'] } }, 'rail', { basic: { type: 'medium weapon' } }), { img: 'fixtures/rail-art.svg' }),
   new Item(actor, 'Silver Hail', 'artifact', { cyphersystem: { tags: ['tagHP'] } }, 'hailArt'),
   new Item(actor, 'Silver Hail', 'attack', { 'cypher-card-sheet': { linkedArtifact: 'hailArt' } }, 'hailAtk', { basic: { type: 'heavy weapon' } }),
   Object.assign(new Item(actor, 'Missile Bay', 'equipment', { [MOD]: { hack: 3 } }), { img: 'systems/cyphersystem/icons/items/equipment.svg' }),
   new Item(actor, 'Long-Range Sensor Array', 'equipment'),
   new Item(actor, 'Combat Knife', 'attack', {}, 'knife', { basic: { type: 'light weapon' } }),
   new Item(actor, 'Field Rations', 'equipment'),
   new Item(actor, 'Pilot Jacket', 'armor')
];
actor.items.get = (id) => actor.items.find((i) => i.id === id);
actor.items.getName = (n) => actor.items.find((i) => i.name === n);

const el = document.getElementById('tok');
const token = {
   name: 'Corvus', actor, w: 100, h: 100, center: { x: 420, y: 330 }, controlled: true, isTargeted: false, inCombat: true,
   document: { isOwner: true, hidden: false, toggleCombatant: async () => {} },
   control() {}, setTarget(v) { this.isTargeted = v; }
};
el.style.left = `${token.center.x - 50}px`;
el.style.top = `${token.center.y - 50}px`;
window.canvas = {
   stage: { scale: { x: 1 } },
   clientCoordinatesFromCanvas: (p) => ({ x: p.x, y: p.y }),
   tokens: { controlled: [token], hud: null, placeables: [token] }
};

const store = await import('../scripts/store.js');
await store.setLevel(actor, 'temperature', 2);
await store.setLevel(actor, 'recoil', 4);
const { radialMenu } = await import('../scripts/radial.js');
window.radialMenu = radialMenu;
window.store = store;
window.actor = actor;
window.token = token;
// Mock Card Sheet cards, one per item, for the Hacked overlay.
const cardsEl = document.getElementById('cards');
for (const item of actor.items.filter((i) => i.type !== 'tag'))
{
   const art = item.img && !item.img.startsWith('systems/') ? item.img : 'fixtures/rail-art.svg';
   cardsEl.insertAdjacentHTML('beforeend', `<article class="ccs-card" data-item-id="${item.id}"><button class="ccs-card-body"><img class="ccs-card-img" src="${art}" alt=""><span class="ccs-card-shade"></span><span class="ccs-card-name">${item.name}</span></button></article>`);
}
window.decorate = async () => (await import('../scripts/card-overlay.js')).decorateCards(cardsEl, actor);
radialMenu.open(token);
window.ready = true;
</script>
</body>
</html>
