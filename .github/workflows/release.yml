# Builds the module when a GitHub release is published (tag like v0.1.0):
# stamps the version and a tag-specific download link into module.json, zips the module,
# and attaches module.json and module.zip to the release. Foundry's manifest URL
# (releases/latest/download/module.json) then always points at the newest release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm run check

      - name: Stamp version and download URL
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Zip module
        run: zip -r module.zip module.json README.md scripts lang

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
